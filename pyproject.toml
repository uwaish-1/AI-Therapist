[project]
name = "safespace-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "uwaish-1", email = "uwaishm82@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "groq>=1.7.0",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "ollama>=0.6.3",
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "twilio>=9.11.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
safespace-ai-agent = "safespace_ai_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "Backend.main:app"